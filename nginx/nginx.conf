# Proxy inverso: / va al frontend y /api al backend, en el mismo origen.
# Los documentos nunca se sirven como archivos estáticos: solo por /api.
upstream sigs_backend {
    server backend:8000;
}

upstream sigs_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    location /api/ {
        proxy_pass http://sigs_backend;
        # $http_host conserva el puerto para que la verificación CSRF de origen funcione.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://sigs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
