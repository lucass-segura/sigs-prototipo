# SIGS · Prototipo local. Levanta todo con: docker compose up --build
name: sigs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # El rol de la aplicación no es superusuario: así los triggers de la
      # auditoría no se pueden saltear con SQL directo.
      DB_NAME: ${DB_NAME:-sigs}
      DB_USER: ${DB_USER:-sigs_app}
      DB_PASSWORD: ${DB_PASSWORD:-sigs_app}
    volumes:
      - datos:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-sigs}
      DB_USER: ${DB_USER:-sigs_app}
      DB_PASSWORD: ${DB_PASSWORD:-sigs_app}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DOCUMENTOS_DIR: /data/documentos
    volumes:
      - documentos:/data/documentos
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  datos:
  documentos:
